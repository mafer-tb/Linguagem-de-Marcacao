<!DOCTYPE html> <!-- Declaração de documento html-->
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Exemplo</title> <!--Título da página-->
	</head>
	<body> <!-- define o corpo do documento-->
		<header> <!-- Cabeçalho -->
			<h1>Título da página</h1> <!--Define um título grande-->
			<nav> <!--tag define um conjunto de links de navegação.-->
				<p>Home</p> <!--paragrafo-->
				</nav> <!--tag define um conjunto de links de navegação.-->
		</header>
		<main> <!--tag especifica o conteúdo principal de um documento.-->
			<article>
				<h2>Artigo 1</h2> <!--Títulos das seções-->
				<p>Este é um artigo sobre...</p> <!-- paragrafo -->
			</article>
			<article>
				<h2>Artigo 2</h2> <!--Títulos das seções-->
				<p>Este é outro artigo sobre...</p> <!-- paragrafo-->
			</article>
		</main> <!--tag especifica o conteúdo principal de um documento.-->
		<footer>
		<p>&copy; 2024 Exemplo</p><!-- paragrafo-->
		</footer>
	</body> <!--define o corpo do documento-->
</html>
