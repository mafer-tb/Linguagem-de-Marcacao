<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Float</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <h2>Float</h2>
    <p>Serve para mudar a posição do elemento na tela, seguindo seu ancestral mais proximo.</p>
    <ul>
        <li>Float: left; -> flutua para esquerda</li>
        <li>Float: right; -> flutua para direita</li>
        <li>Clear: both; -> limpa os estilos anteriores</li>
    </ul>

    <br><br>

    <div>
        <h3>Float: left</h3>
        <P class="esquerda">Um texto...</P>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQYW_VgcPOK33KmV3tD7W7eT309OjH8JCNTENgAjlkjwtoAl7mw70OYtN7F&s=10">
    </div>

    <div>
        <h3>Float: right</h3>
        <P class="direita">Um texto...</P>
        <img  class="direita" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQYW_VgcPOK33KmV3tD7W7eT309OjH8JCNTENgAjlkjwtoAl7mw70OYtN7F&s=10">
    </div>

    <p class="limpar">Um texto qualquer!!!</p>
</body>
</html>
