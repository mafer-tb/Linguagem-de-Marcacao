<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title> Position: Relative;</title>
    <style>
        .Static{
            position: static;
            border: 3px solid #73ad21;
            margin-top: 10%;
        }
        .relative{
            position: relative;
            margin-left: 30px;
            border: 3px solid #73ad21;
        }
    </style>
</head>
<body>
    <div class="Static">
        Essa div tem o estilo position: Static;
    </div>

    <div class="relative">
        Essa div tem o estilo position: Relative;
    </div>
</body>
</html>
